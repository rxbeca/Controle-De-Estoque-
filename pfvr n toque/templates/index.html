<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Estoque do CENDE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { display: block; padding: 2rem; background: #fff; color: #333; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        table { width: 100%; border-collapse: collapse; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e7e7e7; }
        th { background: #2563eb; color: #fff; }
        .btn-danger { background: #d9534f; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn-primary { background: #2563eb; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .form-novo { background: #fff; padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-novo form { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end; }
        .form-novo input, .form-novo select { width: 100%; min-width: 0; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .foto-field { display: flex; flex-direction: column; gap: 4px; color: #475569; font-size: 0.9rem; font-weight: bold; }
        .foto-field input { margin: 0; padding: 6px; background: #f8fafc; }
        .item-foto { width: 48px; height: 48px; object-fit: cover; border-radius: 4px; border: 1px solid #dbe3ef; }
        .sem-foto { color: #94a3b8; font-size: 0.85rem; }
        .foto-editar { display: flex; flex-direction: column; gap: 6px; min-width: 150px; }
        .foto-editar input { max-width: 190px; font-size: 0.8rem; }
        .form-editar input, .form-editar select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 100%; }
        .acoes { display: flex; gap: 8px; align-items: center; }
        .armarios-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin: 1rem 0 2rem; }
        .armario-card { background: #fff; padding: 1.25rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .armario-card h3 { margin-bottom: 1rem; color: #2563eb; }
        .armario-form { display: flex; gap: 8px; margin-bottom: 1rem; }
        .armario-form input { min-width: 0; flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .armario-itens { padding-left: 1.25rem; margin: 0; }
        .armario-item { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
        .btn-small { background: #d9534f; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
        @media (max-width: 900px) {
            body { padding: 1rem; }
            .form-novo form { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            table { display: block; overflow-x: auto; white-space: nowrap; }
        }
        @media (max-width: 560px) {
            .form-novo form { grid-template-columns: 1fr; }
            .form-novo button { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="header-bar">
        <h1>Estoque de Itens - CENDE (Usuário: <b>{{ usuario }}</b>)</h1>
        <div>
            <a href="{{ url_for('armarios_page') }}" style="margin-right: 1rem; color: #2563eb; font-weight: bold; text-decoration: none;">Armários</a>
            <a href="{{ url_for('logout') }}" style="color: #d9534f; font-weight: bold; text-decoration: none;">Sair do Sistema</a>
        </div>
    </div>

    <div class="form-novo">
        <h3><b>Cadastrar Novo Item</b></h3>
        <form action="{{ url_for('novo_item') }}" method="post" enctype="multipart/form-data" style="margin-top: 10px;">
            <input type="text" name="nome" placeholder="Nome do Item" required>
            <input type="text" name="descricao" placeholder="Descrição" required>
            <input type="text" name="patrimonio" placeholder="Patrimônio" required>
            <input type="text" name="plaqueta" placeholder="Nº Plaqueta" required>
            <input type="text" name="local" placeholder="Local" required>
            <select name="status">
                <option value="DISPONIVEL">DISPONIVEL</option>
                <option value="EM_USO">EM_USO</option>
                <option value="MANUTENCAO">MANUTENCAO</option>
                <option value="INDISPONIVEL">INDISPONIVEL</option>
            </select>
            <label class="foto-field">
                Foto do item (opcional)
                <input type="file" name="imagem" accept=".jpg,.jpeg,.png,.webp,.gif">
            </label>
            <button type="submit" style="background: #2563eb; color: #fff; border: none; padding: 9px 15px; border-radius: 4px; cursor: pointer;">Cadastrar</button>
        </form>
    </div>

    <form action="{{ url_for('dashboard') }}" method="GET" style="margin-bottom: 20px;">
        <input
            type="text"
            name="q"
            value="{{ busca or '' }}"
            placeholder="Pesquisar itens..."
            style="padding: 8px; width: 300px;"
        >
        <button type="submit" style="background: #2563eb; color: #fff; border: none; padding: 9px 15px; border-radius: 4px; cursor: pointer;">Buscar</button>
        {% if busca %}
            <a href="{{ url_for('dashboard') }}"><b>  X  </b></a>
        {% endif %}
    </form>

    <h2>Itens da CENDE</h2>
    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Patrimônio</th>
                <th>Plaqueta</th>
                <th>Local</th>
                <th>Status</th>
                <th>Foto</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for item in itens %}
            <tr>
                <td>
                    <input form="editar-item-{{ item[0] }}" type="text" name="nome" value="{{ item[1] }}" required>
                </td>
                <td><input form="editar-item-{{ item[0] }}" type="text" name="descricao" value="{{ item[2] }}" required></td>
                <td><input form="editar-item-{{ item[0] }}" type="text" name="patrimonio" value="{{ item[3] }}" required></td>
                <td><input form="editar-item-{{ item[0] }}" type="text" name="plaqueta" value="{{ item[4] }}" required></td>
                <td><input form="editar-item-{{ item[0] }}" type="text" name="local" value="{{ item[5] }}" required></td>
                <td>
                    <select form="editar-item-{{ item[0] }}" name="status">
                        <option value="DISPONIVEL" {% if item[6] == 'DISPONIVEL' %}selected{% endif %}>DISPONIVEL</option>
                        <option value="EM_USO" {% if item[6] == 'EM_USO' %}selected{% endif %}>EM_USO</option>
                        <option value="MANUTENCAO" {% if item[6] == 'MANUTENCAO' %}selected{% endif %}>MANUTENCAO</option>
                        <option value="INDISPONIVEL" {% if item[6] == 'INDISPONIVEL' %}selected{% endif %}>INDISPONIVEL</option>
                    </select>
                </td>
                <td>
                    {% if item[7] %}
                        <div class="foto-editar">
                            <img class="item-foto" src="{{ url_for('static', filename='upload/' ~ item[7]) }}" alt="Foto de {{ item[1] }}">
                            <input form="editar-item-{{ item[0] }}" type="file" name="imagem" accept=".jpg,.jpeg,.png,.webp,.gif" aria-label="Escolher nova foto para {{ item[1] }}">
                        </div>
                    {% else %}
                        <div class="foto-editar">
                            <span class="sem-foto">Sem foto</span>
                            <input form="editar-item-{{ item[0] }}" type="file" name="imagem" accept=".jpg,.jpeg,.png,.webp,.gif" aria-label="Escolher foto para {{ item[1] }}">
                        </div>
                    {% endif %}
                </td>
                <td class="acoes">
                    <form id="editar-item-{{ item[0] }}" class="form-editar" action="{{ url_for('editar_item', item_id=item[0]) }}" method="post" enctype="multipart/form-data"></form>
                    <button form="editar-item-{{ item[0] }}" type="submit" class="btn-primary">Salvar</button>
                    <form action="/item/excluir/{{ item[0] }}" method="post" onsubmit="return confirm('Deseja realmente excluir este item?');" style="display:inline;">
                        <button type="submit" class="btn-danger">Excluir</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
